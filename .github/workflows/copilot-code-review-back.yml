name: "💡 Copilot Issue Suggester (BackAssistanceTravelers)"

on:
  schedule:
    - cron: "0 9 1 * *" #  9:00 UTC 1ro de cada mes
  workflow_dispatch:
    inputs:
      suggestion_type:
        description: "Type of suggestions to look for"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - security
          - performance
          - refactoring
          - testing
          - documentation
          - architecture
          - configuration
          - bugs
          - maintainability

permissions:
  contents: read
  issues: write

env:
  BACK_ROOT: source/backend/BackAssistanceTravelers/
  BACK_SOLUTION: source/backend/BackAssistanceTravelers/BackAssistanceTravelers.sln

jobs:
  review:
    name: "🔍 Analyze & Create Issues (Backend)"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout repository (sparse - backend only)"
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ${{ env.BACK_ROOT }}
          sparse-checkout-cone-mode: false

      - name: "📦 Install GitHub Copilot CLI"
        run: |
          curl -fsSL https://gh.io/copilot-install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: "✅ Verify Copilot authentication"
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "Missing COPILOT_PAT. Add a valid fine-grained PAT with Copilot Requests permission." >&2
            exit 1
          fi
          echo "Copilot token detected."

      - name: "🤖 Analyze backend solution and create issues with Copilot CLI"
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          SUGGESTION_TYPE: ${{ inputs.suggestion_type || 'all' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          # Warm-up (optional)
          copilot -p "..." --allow-all-tools

          # Build the prompt based on suggestion type
          if [ "$SUGGESTION_TYPE" = "all" ]; then
            CATEGORIES="Security, Performance, Refactoring, Testing, Documentation, Architecture, Configuration, Bugs, and Maintainability"
          else
            CATEGORIES="$SUGGESTION_TYPE"
          fi

          # Copilot CLI analyzes the repo and creates issues using its GitHub MCP Server
          copilot -p "
          You are analyzing ONLY the backend solution in this repository.

          Scope restrictions (MANDATORY):
          - Only analyze files under: ${{ env.BACK_ROOT }}
          - The solution file is: ${{ env.BACK_SOLUTION }}
          - Do NOT analyze any other folders outside ${{ env.BACK_ROOT }}.

          Follow these steps:

          1. FIRST: Use the GitHub MCP Server to list ALL available labels in this repository.
             SAVE this list - you MUST use these labels when creating issues.

          2. SECOND: Use the GitHub MCP Server to review the last 5 issues in this repository to understand:
             - The language used (Spanish, English, etc.)
             - The title structure (emojis, prefixes like feat:, fix:, etc.)
             - The body structure (sections, formatting)
             - Which labels are typically assigned to each type of issue

          3. THIRD: Analyze ONLY the backend code (scope above) looking for improvements in: $CATEGORIES

          4. FOURTH: For each important suggestion found, create an issue in this repository.
             CRITICAL REQUIREMENTS for each issue:
             - Title: Follow EXACTLY the same style as existing issues
             - Language: Use the SAME language as existing issues
             - Body: Use the SAME structure as existing issues
             - LABELS (MANDATORY):
               * ALWAYS include the '💡 suggestion' label on EVERY issue (this is REQUIRED)
               * ALSO add other appropriate labels based on the suggestion type (security, bug, enhancement, etc.)
               DO NOT create issues without the '💡 suggestion' label!
             - Footer: Include 'This issue was automatically generated by Copilot CLI'

          Create individual issues for each important suggestion, not a single issue with everything.
          REMEMBER: Every issue MUST have the '💡 suggestion' label plus other relevant labels!
          " --allow-all-tools

          echo "✅ Copilot CLI backend analysis completed"
